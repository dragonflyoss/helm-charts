apiVersion: v2
name: dragonfly
description: Dragonfly is an intelligent P2P based image and file distribution system
icon: https://raw.githubusercontent.com/dragonflyoss/dragonfly/main/docs/images/logo/dragonfly.svg
type: application
version: 1.10.1
appVersion: 2.5.4
keywords:
  - dragonfly
  - d7y
  - P2P
  - image

maintainers:
  - name: gaius-qi
    email: gaius.qi@gmail.com
  - name: yxxhero
    email: aiopsclub@163.com
  - name: jim3ma
    email: majinjing3@gmail.com

home: https://d7y.io/

sources:
  - https://github.com/dragonflyoss/dragonfly
  - https://github.com/dragonflyoss/client

annotations:
  artifacthub.io/changes: |
    - Bump Dragonfly to v2.5.4 and Dragonfly Client to v1.5.14.
  artifacthub.io/links: |
    - name: Chart Source
      url: https://github.com/dragonflyoss/helm-charts
    - name: Source
      url: https://github.com/dragonflyoss/dragonfly
    - name: Source
      url: https://github.com/dragonflyoss/client
  artifacthub.io/images: |
    - name: manager
      image: dragonflyoss/manager:v2.5.4
    - name: scheduler
      image: dragonflyoss/scheduler:v2.5.4
    - name: client
      image: dragonflyoss/client:v1.5.14
    - name: seed-client
      image: dragonflyoss/client:v1.5.14
    - name: dfinit
      image: dragonflyoss/dfinit:v1.5.14
    - name: injector
      image: dragonflyoss/injector:v0.1.0

dependencies:
  - name: mysql
    version: 11.1.20
    repository: https://charts.bitnami.com/bitnami
    condition: mysql.enable
  - name: postgres
    version: 0.22.0
    repository: https://cloudpirates-io.github.io/helm-charts
    condition: postgres.enable
  - name: valkey
    alias: redis
    version: 0.12.1
    repository: https://valkey.io/valkey-helm/
    condition: redis.enable
